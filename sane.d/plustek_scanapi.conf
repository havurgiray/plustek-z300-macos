# Plustek engines to use. Without engine lines, /Applications/Plustek/*/ScanApi.framework/ScanApi is searched.
#engine /Applications/Plustek/ePhoto Z300/ScanApi.framework/ScanApi

# Seconds sane_start waits for a photo: at the start of a batch, and for each further photo.
first-page-wait 60
next-page-wait 10

# Colour adjustments after scanning: saturation (1 = as scanned) and a midtone gamma (1 = as scanned).
saturation 0.85
gamma 1.6
